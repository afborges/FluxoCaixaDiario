apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lancamentos-api-hpa
  namespace: fluxo-caixa
  labels:
    app: lancamentos-api
    app.kubernetes.io/part-of: fluxo-caixa-diario
    app.kubernetes.io/component: lancamentos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lancamentos-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Escala quando CPU média ultrapassar 70% do request (100m)
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
