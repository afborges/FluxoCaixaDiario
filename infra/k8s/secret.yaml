# ATENÇÃO: Em produção, utilize um gerenciador de segredos (Azure Key Vault, AWS Secrets Manager,
# HashiCorp Vault, ou Sealed Secrets/External Secrets Operator) em vez de armazenar segredos
# diretamente neste arquivo. Substitua todos os valores CHANGE_ME antes de aplicar.
#
# Aplicar:
#   kubectl apply -f infra/k8s/secret.yaml -n fluxo-caixa
#
# Ou gerar via kubectl (evita o arquivo em disco):
#   kubectl create secret generic fluxo-caixa-secrets -n fluxo-caixa \
#     --from-literal=SQL_SA_PASSWORD='<senha>' \
#     --from-literal=LANCAMENTOS_CONNECTION_STRING='Server=sqlserver,1433;...' \
#     --from-literal=CONSOLIDADO_CONNECTION_STRING='Server=sqlserver,1433;...' \
#     --from-literal=REDIS_CONNECTION='redis-svc:6379' \
#     --from-literal=RABBITMQ_CONNECTION_STRING='amqp://guest:<senha>@rabbitmq-svc:5672/' \
#     --from-literal=LANCAMENTOS_API_KEY='<chave>' \
#     --from-literal=CONSOLIDADO_API_KEY='<chave>' \
#     --from-literal=JWT_SECRET='<segredo>'
apiVersion: v1
kind: Secret
metadata:
  name: fluxo-caixa-secrets
  namespace: fluxo-caixa
  labels:
    app.kubernetes.io/part-of: fluxo-caixa-diario
type: Opaque
stringData:
  # Strings de conexão completas (ASP.NET Core env var convention: __ = hierarquia)
  ConnectionStrings__LancamentosDb: "Server=sqlserver,1433;Database=LancamentosDB;User Id=sa;Password=CHANGE_ME;TrustServerCertificate=True;"
  ConnectionStrings__ConsolidadoDb: "Server=sqlserver,1433;Database=ConsolidadoDB;User Id=sa;Password=CHANGE_ME;TrustServerCertificate=True;"
  ConnectionStrings__Redis: "redis-svc:6379"
  RabbitMQ__ConnectionString: "amqp://guest:CHANGE_ME@rabbitmq-svc:5672/"
  RabbitMQ__Password: "CHANGE_ME"
  ApiKey__Key: "CHANGE_ME"
  Jwt__Secret: "CHANGE_ME"
