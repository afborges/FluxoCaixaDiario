apiVersion: apps/v1
kind: Deployment
metadata:
  name: consolidado-api
  namespace: fluxo-caixa
  labels:
    app: consolidado-api
    app.kubernetes.io/part-of: fluxo-caixa-diario
    app.kubernetes.io/component: consolidado
spec:
  # Mínimo de 2 réplicas para Alta Disponibilidade (RNF-02: 100 req/s)
  replicas: 2
  selector:
    matchLabels:
      app: consolidado-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: consolidado-api
        app.kubernetes.io/part-of: fluxo-caixa-diario
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      # Anti-affinity: distribui réplicas em nós diferentes para HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - consolidado-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: consolidado-api
          # Substitua pelo endereço do seu registry, ex: registry.example.com/fluxo-caixa/consolidado-api:1.0.0
          image: fluxo-caixa/consolidado-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fluxo-caixa-config
            - secretRef:
                name: fluxo-caixa-secrets
          resources:
            # Read-heavy: recursos maiores para suportar RNF-02 (100 req/s) + cache Redis
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
