worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream lancamentos {
        server lancamentos-api:8080;
    }

    upstream consolidado {
        server consolidado-api:8080;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    server {
        listen 80;
        server_name _;

        limit_req zone=api_limit burst=200 nodelay;

        location /api/lancamentos {
            proxy_pass http://lancamentos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/consolidado {
            proxy_pass http://consolidado;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /health/lancamentos {
            proxy_pass http://lancamentos/health;
        }

        location /health/consolidado {
            proxy_pass http://consolidado/health;
        }
    }
}